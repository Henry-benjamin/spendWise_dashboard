<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpendWise - Budgeting Foundation</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="dashboard-container">
      <!-- Sidebar -->
      <aside class="sidebar">
        <h2>SpendWise</h2>
        <nav>
          <ul>
            <li><a href="#" class="active">Dashboard</a></li>
            <li><a href="#">Transactions</a></li>
            <li><a href="#">Analytics</a></li>
            <li><a href="#">Settings</a></li>
          </ul>
        </nav>
      </aside>

      <!-- Main Content Area -->
      <main class="main-content">
        <!-- Header -->
        <header class="header">
          <h1>SpendWise Financial Overview</h1>
          <div class="user-profile">Welcome, User</div>
        </header>

        <!-- Category Cards Grid -->
        <section class="cards-grid">
          <div class="card" tabindex="0">
            <h3>Total Income</h3>
            <p class="amount" id="display-income">$0.00</p>
          </div>
          <div class="card" tabindex="0">
            <h3>Total Expenses</h3>
            <p class="amount" id="display-expenses">$0.00</p>
          </div>
          <div class="card" tabindex="0">
            <h3>Remaining Balance</h3>
            <p class="amount" id="display-balance">$0.00</p>
          </div>
          <div class="card" tabindex="0">
            <h3>Savings Goal</h3>
            <p class="amount" id="display-savings">$0.00</p>
          </div>
        </section>
      </main>
    </div>

    <!-- Link JavaScript File for Week 6 -->
    <script src="script.js"></script>
  </body>
</html>
