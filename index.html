<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpendWise - Interactive Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="dashboard-container">
      <!-- Sidebar -->
      <aside class="sidebar">
        <h2>SpendWise</h2>
        <nav>
          <ul>
            <li><a href="#" class="active">Dashboard</a></li>
            <li><a href="#">Transactions</a></li>
            <li><a href="#">Analytics</a></li>
            <li><a href="#">Settings</a></li>
          </ul>
        </nav>
      </aside>

      <!-- Main Content Area -->
      <main class="main-content">
        <!-- Header -->
        <header class="header">
          <h1>SpendWise Financial Overview</h1>
          <div class="user-profile">Welcome, User</div>
        </header>

        <!-- Category Cards Grid -->
        <section class="cards-grid">
          <div class="card" tabindex="0">
            <h3>Total Income</h3>
            <p class="amount" id="display-income">$3,000.00</p>
          </div>
          <div class="card" tabindex="0">
            <h3>Total Expenses</h3>
            <p class="amount" id="display-expenses">$0.00</p>
          </div>
          <div class="card" tabindex="0">
            <h3>Remaining Balance</h3>
            <p class="amount" id="display-balance">$3,000.00</p>
          </div>
          <div class="card" tabindex="0">
            <h3>Budget Status</h3>
            <p class="amount" id="display-status" style="font-size: 1.1rem">
              Balanced
            </p>
          </div>
        </section>

        <!-- Interaction Section: Add Expense Form -->
        <section class="interaction-section">
          <div class="form-card">
            <h3>Add New Expense</h3>
            <form id="expense-form">
              <div class="form-group">
                <label for="expense-name">Expense Description:</label>
                <input
                  type="text"
                  id="expense-name"
                  placeholder="e.g., Groceries"
                  required
                />
              </div>
              <div class="form-group">
                <label for="expense-amount">Amount ($):</label>
                <input
                  type="number"
                  id="expense-amount"
                  placeholder="e.g., 50.00"
                  step="0.01"
                  required
                />
              </div>
              <button type="submit" class="btn-primary">Add Expense</button>
            </form>
          </div>

          <div class="transactions-card">
            <h3>Expense Records</h3>
            <ul id="expense-list">
              <!-- Dynamically populated via loops and DOM manipulation -->
              <li class="empty-state">No expenses added yet.</li>
            </ul>
          </div>
        </section>
      </main>
    </div>

    <!-- Link Interactive JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
