<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpendWise Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="dashboard-container">
      <!-- Sidebar -->
      <aside class="sidebar">
        <h2>SpendWise</h2>
        <nav>
          <ul>
            <li><a href="#" class="active">Dashboard</a></li>
            <li><a href="#">Transactions</a></li>
            <li><a href="#">Analytics</a></li>
            <li><a href="#">Settings</a></li>
          </ul>
        </nav>
      </aside>

      <!-- Main Content Area -->
      <main class="main-content">
        <!-- Header -->
        <header class="header">
          <h1>Financial Overview</h1>
          <div class="user-profile">Welcome, Henry</div>
        </header>

        <!-- Category Cards Grid (6 Cards) -->
        <section class="cards-grid">
          <div class="card" tabindex="0">
            <h3>Food & Dining</h3>
            <p class="amount">$450.00</p>
          </div>
          <div class="card" tabindex="0">
            <h3>Transport</h3>
            <p class="amount">$120.00</p>
          </div>
          <div class="card" tabindex="0">
            <h3>Rent</h3>
            <p class="amount">$1,200.00</p>
          </div>
          <div class="card" tabindex="0">
            <h3>Entertainment</h3>
            <p class="amount">$85.00</p>
          </div>
          <div class="card" tabindex="0">
            <h3>Savings</h3>
            <p class="amount">$500.00</p>
          </div>
          <div class="card" tabindex="0">
            <h3>Utilities</h3>
            <p class="amount">$150.00</p>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
